[package]
name = "tuifeed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
feed-rs = "3.0.0"
open = "5.4.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
toml = "1.1.6"
